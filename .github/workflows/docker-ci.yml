name: Fraud API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'          # Ignores README and any other markdown files
      - '.gitignore'     # Ignores gitignore changes
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Grab the code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Install Python, DVC, and Project Dependencies
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc pytest httpx

      # 3. Authenticate with DagsHub and pull the model
      - name: Pull Data from DagsHub via DVC
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user $DAGSHUB_USERNAME
          dvc remote modify origin --local password $DAGSHUB_TOKEN
          dvc pull

      # 4. Test the API logic with Pytest
      - name: Run Pytest
        run: python -m pytest tests/

      # 5. Build the Docker Container to ensure no infrastructure code is broken
      - name: Build Docker Image
        run: docker build --build-arg DAGSHUB_USERNAME=${{ secrets.DAGSHUB_USERNAME }} --build-arg DAGSHUB_TOKEN=${{ secrets.DAGSHUB_TOKEN }} -t fraud-api:ci-test .